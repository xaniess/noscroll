name: Build NoScroll iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.17.1 --activate

      - name: Install engine dependencies
        run: pnpm install --dir engine

      - name: Test engine
        run: pnpm --dir engine test

      - name: Build engine
        run: pnpm --dir engine build

      - name: Sync engine and rules
        run: node tools/sync-engine.mjs

      - name: Test Swift core
        run: |
          cd ios/NoScrollCore
          swift test

      - name: Show available Xcode schemes
        run: |
          xcodebuild \
            -project ios/NoScroll.xcodeproj \
            -list

      - name: Build NoScroll without signing
        run: |
          xcodebuild \
            -project ios/NoScroll.xcodeproj \
            -scheme NoScroll \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoScroll.app Payload/
          zip -r NoScroll-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NoScroll-iOS-unsigned
          path: NoScroll-unsigned.ipa
